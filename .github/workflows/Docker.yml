name: Docker

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to registry'
        required: false
        default: true
        type: boolean
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
    branches: [release/paclet]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wolframresearch/mcpserver
  WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
  PUSH_IMAGE: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.push) }}

jobs:

  Build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      # For workflow_run events, GITHUB_SHA is the tip of the default branch,
      # which by then already contains the post-release version bump, so check
      # out the commit the Release workflow actually ran on instead.
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract version from PacletInfo.wl
      id: version
      run: |
        VERSION=$(grep -oP '"Version"\s*->\s*"\K[^"]+' PacletInfo.wl)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Determine built commit
      id: commit
      run: |
        SHA=$(git rev-parse --short=7 HEAD)
        echo "sha=$SHA" >> $GITHUB_OUTPUT
        echo "Built commit: $SHA"

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        # The version tag is limited to release builds and trusted branches so
        # that an ad-hoc dispatch from another branch cannot overwrite the
        # version tag of an existing release.
        tags: |
          type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/paclet' }}
          type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/paclet' }}
          type=raw,value=${{ steps.commit.outputs.sha }}
          type=ref,event=branch,enable=${{ github.event_name != 'workflow_run' }}
          type=raw,value=release-paclet,enable=${{ github.event_name == 'workflow_run' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ env.PUSH_IMAGE == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        secrets: |
          WOLFRAMSCRIPT_ENTITLEMENTID=${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}

    - name: Test Docker image
      # The test pulls the image from the registry, so there is nothing to
      # test when the build was not pushed.
      if: env.PUSH_IMAGE == 'true'
      run: |
        echo "Testing Docker image from registry..."
        IMAGE_TAG="$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)"
        echo "Using image tag: $IMAGE_TAG"
        docker pull "$IMAGE_TAG"
        echo "Image pulled successfully"
        # Basic sanity check: verify that the container can start.
        # Note: Full runtime test requires Wolfram Engine license.
        # Override ENTRYPOINT since the default starts the MCP server on stdin.
        docker run --rm --entrypoint wolframscript --env WOLFRAMSCRIPT_ENTITLEMENTID "$IMAGE_TAG" -code '$Version'
